[whatsapp]
api_url = https://builder.factorybots.cloud/api/v1/REEMPLAZAR_CON_TU_ID/message
api_key = REEMPLAZAR_CON_TU_API_KEY
phone = REEMPLAZAR_CON_TU_NUMERO
server_id = MONITOR-DF-SOURCE

[monitoring]
log_dir = /var/log/notify
check_interval = 300
docker_check_interval = 180
miner_check_interval = 120

[whitelist]
paths = /opt/notify/,/home/df-source/,/usr/bin/,/usr/sbin/,/usr/lib/,/usr/share/,/usr/local/,/bin/,/sbin/,/snap/,/var/lib/,/usr/bin/docker
args = docker stats,docker ps,docker top,docker exec,ps axo pid,pcpu,main_col_shop.py,main_aki.py,run_syst.sh,run_aki.sh
commands = python3,docker,ps

[thresholds]
vhost_timeout = 10
cpu_miner_threshold = 80
docker_cpu_threshold = 70
mysql_max_connections = 50
mysql_failed_login_window = 300
mysql_failed_login_threshold = 5
fail2ban_bulk_threshold = 5
fail2ban_bulk_window = 300
